name: Glassine

options:
  bundleIdPrefix: com.warhead88
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Glassine:
    type: application
    platform: macOS
    sources:
      - path: Glassine
      # App icon: Icon Composer document (Liquid Glass on macOS 26+, flat .icns fallback for 14–15)
      - path: Design/glassine.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warhead88.glassine
        PRODUCT_NAME: Glassine
        INFOPLIST_FILE: Glassine/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Glassine/Resources/Glassine.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7MJWXG9L6K
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: glassine
        COMBINE_HIDPI_IMAGES: YES
