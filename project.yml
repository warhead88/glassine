name: Glassine

options:
  bundleIdPrefix: com.warhead88
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Signing lives in an xcconfig: ad hoc unless Config/Signing.local.xcconfig sets a team or certificate.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Glassine:
    type: application
    platform: macOS
    sources:
      - path: Glassine
      # App icon: Icon Composer document (Liquid Glass on macOS 26+, flat .icns fallback for 14–15)
      - path: Design/glassine.icon
        type: file
        buildPhase: resources
      # Fraunces (SIL OFL), loaded at launch through ATSApplicationFontsPath
      - path: Design/fonts/Fraunces.ttf
        buildPhase: resources
      - path: Design/fonts/Fraunces-Italic.ttf
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warhead88.glassine
        PRODUCT_NAME: Glassine
        INFOPLIST_FILE: Glassine/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Glassine/Resources/Glassine.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: glassine
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - GlassineTests

  GlassineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Glassine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warhead88.glassine.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Glassine.app/Contents/MacOS/Glassine"
        BUNDLE_LOADER: "$(TEST_HOST)"
