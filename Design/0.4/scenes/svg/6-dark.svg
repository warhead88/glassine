<rect x="344" y="352" width="54" height="54" rx="10" fill="#E4583F" stroke="#30353E" stroke-width="1" />
<text x="344" y="424" class="s" fill="#A4A7AE" text-anchor="start" style="font-size:11px;font-weight:500">Rec</text>
<text x="344" y="438" class="m" fill="#8A8E97" text-anchor="start" style="font-size:9px;font-weight:400">#E4583F</text>
<rect x="408" y="352" width="54" height="54" rx="10" fill="#A3B59C" stroke="#30353E" stroke-width="1" />
