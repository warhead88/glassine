<text x="88" y="438" class="m" fill="#8A8E97" text-anchor="start" style="font-size:9px;font-weight:400">#181B21</text>
<rect x="152" y="352" width="54" height="54" rx="10" fill="#20242B" stroke="#30353E" stroke-width="1" />
