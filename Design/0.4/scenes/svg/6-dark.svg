<text x="408" y="438" class="m" fill="#8A8E97" text-anchor="start" style="font-size:9px;font-weight:400">#A3B59C</text>
<rect x="472" y="352" width="54" height="54" rx="10" fill="#8EA6C2" stroke="#30353E" stroke-width="1" />
<text x="472" y="424" class="s" fill="#A4A7AE" text-anchor="start" style="font-size:11px;font-weight:500">Stamp</text>
