</g>
<text x="470.0" y="331.5" class="s" fill="#1C2230" text-anchor="middle" style="font-size:13px;font-weight:500">Rounded</text>
<text x="546.0" y="331.5" class="s" fill="#585F6C" text-anchor="middle" style="font-size:13px;font-weight:400">Square</text>
<line x1="54" y1="350" x2="586" y2="350" stroke="#E3E3DC" stroke-width="1" />
