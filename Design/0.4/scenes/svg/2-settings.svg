<text x="34" y="494" class="f" fill="#1C2230" text-anchor="start" style="font-size:28px;font-weight:460;letter-spacing:-0.3px">Screen recording</text>
<rect x="34" y="512" width="572" height="92" rx="12" fill="#F9F9F6" stroke="#D5D6CE" stroke-width="1" />
<text x="54" y="540" class="s" fill="#1C2230" text-anchor="start" style="font-size:14px;font-weight:400">Countdown before recording</text>
<rect x="482" y="522.0" width="104" height="26" rx="7" fill="#F9F9F6" stroke="#D5D6CE" stroke-width="1" />
<text x="493" y="539.6" class="s" fill="#1C2230" text-anchor="start" style="font-size:13.5px;font-weight:400">3 seconds</text>
<path d="M566 533.5 l3.5 3.5 l3.5 -3.5" fill="none" stroke="#585F6C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="54" y1="558" x2="586" y2="558" stroke="#E3E3DC" stroke-width="1" />
<text x="54" y="586" class="s" fill="#1C2230" text-anchor="start" style="font-size:14px;font-weight:400">Show the pointer</text>
<rect x="548" y="570" width="38" height="22" rx="11.0" fill="#1C2230" />
<circle cx="575.0" cy="581.0" r="8.5" fill="#F7F6F1" />
<text x="36" y="630" class="s" fill="#585F6C" text-anchor="start" style="font-size:12.5px;font-weight:400">The countdown runs inside the record button. Off starts recording</text>
<text x="36" y="648" class="s" fill="#585F6C" text-anchor="start" style="font-size:12.5px;font-weight:400">as soon as you press it.</text>
